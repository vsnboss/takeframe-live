name: Enlarge TAKEFRAME hero player

on:
  push:
    paths:
      - ".github/workflows/enlarge-hero-player.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Enlarge and reposition hero player
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('styles.css')
          s = p.read_text()
          changes = [
          (""".hero-player-wrap {
            position: relative;
            align-self: end;
            display: flex;
            justify-content: center;
            z-index: 4;
          }
          .hero-player {
            width: min(650px, 110%);
            margin-left: -12px;
            filter: drop-shadow(0 0 22px rgba(0, 163, 255, 0.28)) drop-shadow(0 30px 40px rgba(0,0,0,.46));
          }
          """, """.hero-player-wrap {
            position: relative;
            align-self: stretch;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            z-index: 4;
            overflow: visible;
            margin-left: -8%;
            margin-right: -18%;
          }
          .hero-player {
            width: min(820px, 170%);
            max-width: none;
            margin-left: 0;
            transform: translateX(4%);
            filter: drop-shadow(0 0 28px rgba(0, 163, 255, 0.34)) drop-shadow(0 34px 46px rgba(0,0,0,.5));
          }
          """),
          ("""@media (max-width: 1440px) {
            .hero-layout { grid-template-columns: 1fr 0.8fr 1.02fr; min-height: 780px; }
            .hero-player { width: min(560px, 110%); }
            .hero-console { width: 100%; }
          """, """@media (max-width: 1440px) {
            .hero-layout { grid-template-columns: 1fr 0.8fr 1.02fr; min-height: 780px; }
            .hero-player-wrap { margin-left: -14%; margin-right: -24%; }
            .hero-player { width: min(760px, 180%); transform: translateX(6%); }
            .hero-console { width: 100%; }
          """),
          ("""  .hero-player-wrap { order: 2; }
            .hero-console-wrap {
          """, """  .hero-player-wrap { order: 2; margin: 0; align-self: end; }
            .hero-console-wrap {
          """),
          ("""  .hero-player { width: min(480px, 82vw); margin: 0 auto; }
          """, """  .hero-player { width: min(620px, 94vw); max-width: 100%; margin: 0 auto; transform: none; }
          """)]
          for old, new in changes:
              if old not in s:
                  raise SystemExit('Expected CSS block not found')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          rm -f .github/workflows/enlarge-hero-player.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enlarge hero player and bridge hero gap"
          git push origin HEAD:main
