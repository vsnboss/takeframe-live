name: Install uploaded TAKEFRAME package

on:
  push:
    paths:
      - ".github/workflows/install-takeframe-package.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract package into repository root
        shell: bash
        run: |
          set -euo pipefail
          ZIP="TAKEFRAME_CEO_REBUILD_ROOT_PACKAGE.zip"
          test -f "$ZIP"
          unzip -q -o "$ZIP" -d .
          test -f index.html
          test -f styles.css
          test -f script.js
          test -f vercel.json
          test -d assets
          test -d fonts
          rm -f "$ZIP"
          rm -f .github/workflows/install-takeframe-package.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit installed website
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install clean TAKEFRAME interactive website"
          git push origin HEAD:main
