name: Update TAKEFRAME ingest workflow

on:
  push:
    paths:
      - ".github/workflows/update-ingest-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace camera ingest with onboarding source workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text()
          old = '''            <article>
              <div class="workflow-icon"><svg viewBox="0 0 24 24"><path d="M4 7h9v6H4z"/><path d="M14 9h6v8h-9v-2"/><path d="M8 16 4 20"/></svg></div>
              <span>1</span>
              <h3>Ingest sources</h3>
              <p>Connect cameras, replays, data feeds and more.</p>
            </article>'''
          new = '''            <article class="workflow-ingest">
              <div class="workflow-source-preview" aria-label="TAKEFRAME add match sources onboarding preview">
                <div class="source-preview-head"><span>Add match sources</span><b>Multiple sources</b></div>
                <div class="source-preview-drop">
                  <strong>Drop files, folders or images</strong>
                  <small>or paste match links</small>
                </div>
                <div class="source-preview-types"><i>Link</i><i>PDF</i><i>CSV</i><i>Image</i><i>Team sheet</i><i>Photos</i></div>
              </div>
              <span>1</span>
              <h3>Ingest match sources</h3>
              <p>Add match links, team sheets, spreadsheets, screenshots, player photos, club assets and pasted text.</p>
            </article>'''
          if old not in html:
              raise SystemExit('Expected ingest block was not found')
          index.write_text(html.replace(old, new))

          styles = Path('styles.css')
          css = styles.read_text()
          marker = '.workflow-icon {\n  width: 92px; height: 92px;'
          addition = '''.workflow-source-preview {
  width: 100%;
  height: 92px;
  margin: 0 auto 22px;
  padding: 10px;
  overflow: hidden;
  border-radius: 16px;
  border: 1px solid rgba(20, 216, 255, 0.42);
  background: linear-gradient(180deg, rgba(8, 27, 48, 0.98), rgba(4, 13, 25, 0.98));
  box-shadow: 0 16px 32px rgba(0,0,0,.24), inset 0 0 20px rgba(20,216,255,.04), 0 0 22px rgba(20,216,255,.08);
}
.source-preview-head {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  text-transform: uppercase;
  font-size: 7px;
  font-weight: 800;
  color: #e9f4ff;
}
.source-preview-head b { color: var(--cyan); font-size: 6px; }
.source-preview-drop {
  margin-top: 7px;
  min-height: 37px;
  display: grid;
  place-items: center;
  align-content: center;
  border: 1px dashed rgba(20,216,255,.42);
  border-radius: 7px;
  background: rgba(2, 11, 22, .7);
  text-align: center;
}
.source-preview-drop strong {
  font-size: 7px;
  text-transform: uppercase;
  color: #f4f8ff;
}
.source-preview-drop small {
  margin-top: 2px;
  font-size: 6px;
  color: #8fa8c7;
}
.source-preview-types {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 3px;
  margin-top: 6px;
}
.source-preview-types i {
  min-width: 0;
  padding: 3px 1px;
  overflow: hidden;
  border: 1px solid rgba(98, 137, 184, .24);
  border-radius: 4px;
  color: #a9c0dc;
  font-size: 5px;
  font-style: normal;
  text-align: center;
  white-space: nowrap;
}
.workflow-ingest > span {
  border-color: rgba(20, 216, 255, 0.62) !important;
  color: var(--cyan) !important;
  box-shadow: 0 0 16px rgba(20, 216, 255, 0.18);
}

.workflow-icon {
  width: 92px; height: 92px;'''
          if marker not in css:
              raise SystemExit('Expected workflow CSS marker was not found')
          styles.write_text(css.replace(marker, addition))
          PY

          rm -f .github/workflows/update-ingest-source.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit updated workflow section
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix ingest workflow to use match source onboarding"
          git push origin HEAD:main
