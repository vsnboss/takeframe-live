<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 760" role="img" aria-labelledby="t d"><title id="t">TAKEFRAME add match sources screen</title><desc id="d">An onboarding interface for adding match links, PDFs, spreadsheets, screenshots, team sheets, player photos, club assets and pasted text.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061326"/><stop offset="1" stop-color="#020914"/></linearGradient><linearGradient id="btn" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#2589d8"/><stop offset="1" stop-color="#104a84"/></linearGradient></defs><rect width="1080" height="760" rx="28" fill="url(#bg)"/><rect x="2" y="2" width="1076" height="756" rx="26" fill="none" stroke="#1f6a9d"/><text x="36" y="56" fill="#f4f7ff" font-family="Arial" font-size="28" font-weight="800">ADD MATCH SOURCES</text><text x="1040" y="56" fill="#00c8ff" text-anchor="end" font-family="Arial" font-size="15" font-weight="800">MULTIPLE SOURCES = BETTER RESULTS</text><rect x="34" y="88" width="1012" height="400" rx="20" fill="#031022" stroke="#00a8df" stroke-dasharray="6 6"/><text x="540" y="180" fill="#eaf4ff" text-anchor="middle" font-family="Arial" font-size="58">☁</text><text x="540" y="238" fill="#f4f7ff" text-anchor="middle" font-family="Arial" font-size="25" font-weight="800">DROP FILES, FOLDERS OR IMAGES HERE</text><line x1="210" y1="278" x2="470" y2="278" stroke="#2b405c"/><text x="540" y="285" fill="#8ca2bd" text-anchor="middle" font-family="Arial" font-size="16">or</text><line x1="610" y1="278" x2="870" y2="278" stroke="#2b405c"/><text x="540" y="335" fill="#f4f7ff" text-anchor="middle" font-family="Arial" font-size="21" font-weight="800">PASTE ONE OR MORE MATCH LINKS</text><rect x="180" y="365" width="610" height="56" rx="10" fill="#020914" stroke="#1579ae"/><text x="205" y="400" fill="#71859f" font-family="Arial" font-size="18">https://...</text><rect x="810" y="365" width="92" height="56" rx="10" fill="#0a3453" stroke="#00a8df"/><text x="856" y="399" fill="#fff" text-anchor="middle" font-family="Arial" font-size="15" font-weight="800">ADD</text><text x="540" y="458" fill="#00c8ff" text-anchor="middle" font-family="Arial" font-size="15" font-weight="800">+ ADD ANOTHER SOURCE</text><text x="34" y="530" fill="#8499b3" font-family="Arial" font-size="14" font-weight="800">ADD FROM</text><g font-family="Arial" font-size="12" font-weight="800" text-anchor="middle"><g transform="translate(34 550)"><rect width="116" height="96" rx="14" fill="#071528" stroke="#25496d"/><text x="58" y="40" fill="#00c8ff" font-size="25">↗</text><text x="58" y="70" fill="#dce8f6">PASTE LINK</text></g><g transform="translate(162 550)"><rect width="116" height="96" rx="14" fill="#071528" stroke="#25496d"/><text x="58" y="40" fill="#ff3830" font-size="22">PDF</text><text x="58" y="70" fill="#dce8f6">DOCUMENT</text></g><g transform="translate(290 550)"><rect width="116" height="96" rx="14" fill="#071528" stroke="#25496d"/><text x="58" y="40" fill="#37e08b" font-size="22">XLS</text><text x="58" y="70" fill="#dce8f6">EXCEL / CSV</text></g><g transform="translate(418 550)"><rect width="116" height="96" rx="14" fill="#071528" stroke="#25496d"/><text x="58" y="40" fill="#00c8ff" font-size="22">IMG</text><text x="58" y="70" fill="#dce8f6">SCREENSHOT</text></g><g transform="translate(546 550)"><rect width="116" height="96" rx="14" fill="#071528" stroke="#25496d"/><text x="58" y="40" fill="#ffc247" font-size="22">XI</text><text x="58" y="70" fill="#dce8f6">TEAM SHEET</text></g><g transform="translate(674 550)"><rect width="116" height="96" rx="14" fill="#071528" stroke="#25496d"/><text x="58" y="40" fill="#00c8ff" font-size="22">◎</text><text x="58" y="70" fill="#dce8f6">PLAYER PHOTOS</text></g><g transform="translate(802 550)"><rect width="116" height="96" rx="14" fill="#071528" stroke="#25496d"/><text x="58" y="40" fill="#ffc247" font-size="22">◇</text><text x="58" y="70" fill="#dce8f6">CLUB ASSETS</text></g><g transform="translate(930 550)